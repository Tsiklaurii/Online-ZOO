<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="../styles/css/global.css">
</head>

<body>
    <div class="register_in_container">
        <form class="register" id="registerForm">
            <h1>Registration</h1>

            <div class="input_group">
                <input type="text" id="nameInput" placeholder="Name">
                <div class="error" id="nameError"></div>
            </div>

            <div class="input_group">
                <input type="text" id="loginInput" placeholder="Login">
                <div class="error" id="loginError"></div>
            </div>

            <div class="input_group">
                <input type="email" id="emailInput" placeholder="Email">
                <div class="error" id="emailError"></div>
            </div>

            <div class="input_group">
                <input type="password" id="passwordInput" placeholder="Password">
                <div class="error" id="passwordError"></div>
            </div>

            <div class="input_group">
                <input type="password" id="confirmPasswordInput" placeholder="Confirm Password">
                <div class="error" id="confirmPasswordError"></div>
            </div>

            <button id="registerBtn" disabled>Registration</button>
        </form>
        <div id="error_message" class="error_message"></div>
    </div>

    <script type="module" src="../dist/register/register.js"></script>
</body>

</html>
